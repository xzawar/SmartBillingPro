name: Build Windows app

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Run tests
        shell: cmd
        env:
          CI: "true"
        run: call run-tests.bat
      - name: Build portable app (and installer when WiX is available)
        shell: cmd
        env:
          CI: "true"
        run: call build-exe.bat
      - uses: actions/upload-artifact@v4
        with:
          name: SmartBillingPro-windows
          path: |
            dist/*.zip
            dist/*.exe
          if-no-files-found: error
